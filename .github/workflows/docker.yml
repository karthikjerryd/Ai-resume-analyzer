name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t karthikjerryd/resumeanalyzer-backend:latest ./backend

      - name: Push Backend Image
        run: |
          docker push karthikjerryd/resumeanalyzer-backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t karthikjerryd/resumeanalyzer-frontend:latest ./frontend

      - name: Push Frontend Image
        run: |
          docker push karthikjerryd/resumeanalyzer-frontend:latest
